<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found - Strike Pro</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background:#0a0a0a; color:#fff; display:grid; min-height:100dvh; place-items:center; }
    .box { text-align:center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: .5rem; background: linear-gradient(135deg, #ff0000, #ff6666); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { color:#cfcfcf; margin-bottom: 1.5rem; }
    a { display:inline-block; padding:.8rem 1.6rem; border-radius:999px; text-decoration:none; background:linear-gradient(135deg, #ff0000, #cc0000); color:#fff; box-shadow: 0 4px 15px rgba(255,0,0,.35); }
  </style>
</head>
<body>
  <main class="box">
    <div style="font-size:4rem;">🥊</div>
    <h1>404 - Not Found</h1>
    <p>The page you’re looking for doesn’t exist.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
