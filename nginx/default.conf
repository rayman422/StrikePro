server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Gzip compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS applies only over HTTPS but safe to include here
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

  # Health endpoint
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # No cache for HTML
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /404.html   { add_header Cache-Control "no-store"; }

  # Cache static assets aggressively
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Default: serve files or return 404 for unknown paths
  location / {
    try_files $uri $uri/ =404;
  }

  # API proxy to Node backend
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # Ensure correct content-type for robots and sitemap
  location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
  }
  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
  }

  # Error pages
  error_page 404 /404.html;
  location = /404.html {
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
